build:
  maxIssues: 0
  weights:
    complexity: 1
    formatting: 1
    LongParameterList: 0

complexity:
  LongMethod:
    threshold: 200
  ComplexCondition:
    threshold: 6
  LongParameterList:
    functionThreshold: 20
    constructorThreshold: 20
    ignoreDefaultParameters: true
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInObjects: 30
    thresholdInEnums: 30

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 220
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|preview.*)'

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    functionPattern: '([a-zA-Z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)' # Allow PascalCase for @Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
