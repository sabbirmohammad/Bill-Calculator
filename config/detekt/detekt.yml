build:
  maxIssues: 0
  weights:
    complexity: 1
    formatting: 1
    LongParameterList: 0

complexity:
  LongMethod:
    threshold: 400
  ComplexCondition:
    threshold: 10
  CyclomaticComplexMethod:
    threshold: 35
  NestedBlockDepth:
    threshold: 6
  LongParameterList:
    functionThreshold: 20
    constructorThreshold: 20
    ignoreDefaultParameters: true
  TooManyFunctions:
    thresholdInFiles: 40
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInObjects: 30
    thresholdInEnums: 30

style:
  ReturnCount:
    max: 6
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 300
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|[pP]review.*)'
  UnusedParameter:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    functionPattern: '([a-zA-Z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)' # Allow PascalCase for @Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
