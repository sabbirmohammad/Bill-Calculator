<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ambient Center Energy Glow -->
    <radialGradient id="centerGlow" cx="54" cy="44" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <!-- Dial Plate Gradient -->
    <linearGradient id="dialPlate" x1="24" y1="20" x2="84" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0D1525" />
    </linearGradient>

    <!-- Dial Outer Ring Accent -->
    <linearGradient id="dialRing" x1="20" y1="20" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>

    <!-- 6-Slab Progressive Tariff Arc (Green -> Cyan -> Amber -> Red) -->
    <linearGradient id="tariffArc" x1="24" y1="24" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#00E5FF" />
      <stop offset="68%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Hero Lightning Bolt Gradients -->
    <!-- Left Blade: Electric Cyan -->
    <linearGradient id="boltCyan" x1="42" y1="18" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="30%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Right Blade: Vivid Neon Emerald -->
    <linearGradient id="boltGreen" x1="50" y1="18" x2="64" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Specular Center Spine Highlight -->
    <linearGradient id="boltCoreGlow" x1="56" y1="18" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#A7F3D0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Red Wheel Gradient -->
    <linearGradient id="redWheelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND LAYER ================= -->
  <rect width="108" height="108" fill="url(#bgGrad)" />
  <circle cx="54" cy="45" r="42" fill="url(#centerGlow)" />

  <!-- Outer Technical Meter Orbit Guides -->
  <circle cx="54" cy="54" r="46" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="3 5" stroke-opacity="0.2" />
  <circle cx="54" cy="54" r="41" fill="none" stroke="#64748B" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- ================= FOREGROUND LAYER ================= -->
  <!-- Base Dial Plate (Safe Zone: r=32.5 from center 54, 54) -->
  <g filter="url(#softShadow)">
    <circle cx="54" cy="54" r="32.5" fill="url(#dialPlate)" stroke="url(#dialRing)" stroke-width="1.2" />
    <circle cx="54" cy="54" r="31.2" fill="none" stroke="#00E5FF" stroke-width="0.4" stroke-opacity="0.3" />
  </g>

  <!-- BERC 6-Step Progressive Tariff Arc (Meter Outer Track) -->
  <circle cx="54" cy="54" r="28" fill="none" stroke="url(#tariffArc)" stroke-width="2.6"
          stroke-dasharray="128 176" stroke-linecap="round"
          transform="rotate(130 54 54)" />

  <!-- Sub-ticks around the dial -->
  <g stroke="#64748B" stroke-width="0.8" stroke-linecap="round" opacity="0.65">
    <line x1="28.5" y1="54" x2="30.5" y2="54" />
    <line x1="77.5" y1="54" x2="79.5" y2="54" />
    <line x1="36" y1="36" x2="37.5" y2="37.5" />
    <line x1="72" y1="36" x2="70.5" y2="37.5" />
    <line x1="54" y1="28.5" x2="54" y2="30.5" />
  </g>

  <!-- Induction Disk Recessed Slot & Rotating Strobe Notch -->
  <g>
    <rect x="35" y="58" width="38" height="2.2" rx="1.1" fill="#060910" stroke="#334155" stroke-width="0.5" />
    <line x1="37" y1="59.1" x2="71" y2="59.1" stroke="#94A3B8" stroke-width="0.8" opacity="0.75" />
    <rect x="52.2" y="58.2" width="3.6" height="1.8" rx="0.4" fill="#EF4444" />
  </g>

  <!-- Mechanical Odometer Counter Display Window -->
  <g filter="url(#softShadow)">
    <!-- Bezel Container Frame -->
    <rect x="33" y="63.5" width="42" height="13.5" rx="3" fill="#060911" stroke="#475569" stroke-width="0.8" />
    <rect x="33.8" y="64.3" width="40.4" height="11.9" rx="2" fill="#0B101D" />

    <!-- Whole kWh Wheel 1 (Black) -->
    <rect x="35.2" y="65.2" width="7.2" height="10" rx="1" fill="#131B2E" />
    <text x="38.8" y="72.8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="6.8" font-weight="700" fill="#E2E8F0" text-anchor="middle">0</text>
    <line x1="35.2" y1="65.2" x2="42.4" y2="65.2" stroke="#334155" stroke-width="0.4" />

    <!-- Whole kWh Wheel 2 (Black) -->
    <rect x="43.4" y="65.2" width="7.2" height="10" rx="1" fill="#131B2E" />
    <text x="47.0" y="72.8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="6.8" font-weight="700" fill="#E2E8F0" text-anchor="middle">8</text>
    <line x1="43.4" y1="65.2" x2="50.6" y2="65.2" stroke="#334155" stroke-width="0.4" />

    <!-- Whole kWh Wheel 3 (Black) -->
    <rect x="51.6" y="65.2" width="7.2" height="10" rx="1" fill="#131B2E" />
    <text x="55.2" y="72.8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="6.8" font-weight="700" fill="#E2E8F0" text-anchor="middle">4</text>
    <line x1="51.6" y1="65.2" x2="58.8" y2="65.2" stroke="#334155" stroke-width="0.4" />

    <!-- Decimal Divider Dot -->
    <circle cx="60.3" cy="72" r="0.7" fill="#EF4444" />

    <!-- Decimal 0.1 kWh Wheel 4 (Signature RED Wheel) -->
    <rect x="62.2" y="65.2" width="9.8" height="10" rx="1.2" fill="url(#redWheelGrad)" stroke="#F87171" stroke-width="0.3" />
    <text x="67.1" y="72.8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="6.8" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <line x1="62.2" y1="65.2" x2="72.0" y2="65.2" stroke="#FECACA" stroke-width="0.4" />
  </g>

  <!-- HERO DYNAMIC FACETED LIGHTNING BOLT -->
  <g filter="url(#softShadow)">
    <!-- Ambient Neon Underglow -->
    <path d="M56 18 L42 37 H51 L47 56 L64 34 H55 Z" fill="#00E5FF" opacity="0.32" />

    <!-- Left Facet (Electric Cyan) -->
    <path d="M56 18 L42 37 H51 L47 56 L52.5 35.5 Z" fill="url(#boltCyan)" />

    <!-- Right Facet (Vivid Neon Emerald Green) -->
    <path d="M56 18 L52.5 35.5 L47 56 L64 34 H55 Z" fill="url(#boltGreen)" />

    <!-- Specular Highlight Ribbon down the center spine -->
    <path d="M55.5 19.5 L43.5 36.5 H50.5 L47.5 53.5 L51.5 35.5 Z" fill="url(#boltCoreGlow)" />
    
    <!-- White Hot Apex Spark -->
    <circle cx="56" cy="18" r="1.3" fill="#FFFFFF" />
  </g>

  <!-- Energy Spark Crystals -->
  <path d="M35 30 L36 32 L38 33 L36 34 L35 36 L34 34 L32 33 L34 32 Z" fill="#38BDF8" opacity="0.9" />
  <path d="M73 28 L74 29.5 L75.5 30.5 L74 31.5 L73 33 L72 31.5 L70.5 30.5 L72 29.5 Z" fill="#34D399" opacity="0.9" />
</svg>
