<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- One UI 7 Signature Vibrant Mint to Cyan Teal Gradient -->
    <linearGradient id="oneuiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D287" />
      <stop offset="42%" stop-color="#00BE88" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Screen Inner Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D287" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Button Inset / Soft Shade -->
    <linearGradient id="btnShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Ambient Shadow for Floating Calculator -->
    <filter id="softElevation" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#013A31" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#013A31" flood-opacity="0.14" />
    </filter>

    <!-- Button Soft Shadow -->
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#047857" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- One UI Continuous Squircle Base (rx=118 on 512x512) -->
  <rect width="512" height="512" rx="118" ry="118" fill="url(#oneuiBgGrad)" />

  <!-- Floating Modern Calculator Slate -->
  <g filter="url(#softElevation)">
    <!-- Calculator Body (Centered, width=236, height=348, rx=56) -->
    <rect x="138" y="82" width="236" height="348" rx="56" ry="56" fill="#FFFFFF" />

    <!-- Screen Window (width=188, height=124, rx=32) -->
    <rect x="162" y="106" width="188" height="124" rx="32" ry="32" fill="url(#screenGrad)" />

    <!-- Lightning Bolt Glyph inside Screen (Crisp Pure White) -->
    <path d="M263 126 L230 172 L254 172 L241 210 L282 164 L258 164 Z"
          fill="#FFFFFF"
          stroke="#FFFFFF"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- 2x2 Keypad Grid (Clean One UI Operator Buttons) -->
    <!-- Button 1: Plus (+) [cx=196, cy=282, r=29] -->
    <g filter="url(#btnShadow)">
      <circle cx="196" cy="282" r="29" fill="url(#btnShade)" />
      <path d="M196 268 V296 M182 282 H210" stroke="#059669" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Button 2: Minus (−) [cx=316, cy=282, r=29] -->
    <g filter="url(#btnShadow)">
      <circle cx="316" cy="282" r="29" fill="url(#btnShade)" />
      <path d="M302 282 H330" stroke="#059669" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Button 3: Multiply (×) [cx=196, cy=362, r=29] -->
    <g filter="url(#btnShadow)">
      <circle cx="196" cy="362" r="29" fill="url(#btnShade)" />
      <path d="M186 352 L206 372 M206 352 L186 372" stroke="#059669" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Button 4: Equals (=) [cx=316, cy=362, r=29] -->
    <g filter="url(#btnShadow)">
      <circle cx="316" cy="362" r="29" fill="url(#btnShade)" />
      <path d="M302 357 H330 M302 367 H330" stroke="#059669" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>
</svg>
