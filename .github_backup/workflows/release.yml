name: Build & Publish Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g., v1.0.2)'
        required: false
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Release Artifacts
        id: prepare-apk
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="${{ github.event.inputs.version_name }}"
          fi
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.0.2"
          fi
          
          mkdir -p release-artifacts
          SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          
          if [ -f "$SOURCE_APK" ]; then
            TARGET_APK="release-artifacts/Electricity-Bill-Calculator-${TAG_NAME}.apk"
            cp "$SOURCE_APK" "$TARGET_APK"
            cp "$SOURCE_APK" "release-artifacts/app-release.apk"
            echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "APK ready: $TARGET_APK"
          else
            echo "Error: Release APK not found at $SOURCE_APK"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electricity-bill-calculator-apk
          path: release-artifacts/*.apk
          retention-days: 14

      - name: Create GitHub Release with APK Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare-apk.outputs.tag_name }}
          name: ${{ steps.prepare-apk.outputs.tag_name }} - নতুন আপডেট ও রিলিজ
          body: |
            ## ⚡ বাংলাদেশ বিদ্যুৎ মিটার রিডিং ও বিল ক্যালকুলেটর (${{ steps.prepare-apk.outputs.tag_name }})
            
            ### 📱 সরাসরি এপিকে (APK) ডাউনলোড ও ইনস্টলেশন
            নিচের অ্যাসেটস (Assets) সেকশন থেকে সরাসরি `app-release.apk` বা `Electricity-Bill-Calculator-${{ steps.prepare-apk.outputs.tag_name }}.apk` ফাইলটি ডাউনলোড করে আপনার অ্যান্ড্রয়েড ফোনে ইনস্টল করে নিন।
            
            * **সংস্করণ:** `${{ steps.prepare-apk.outputs.tag_name }}`
            * **নতুন স্প্ল্যাশ স্ক্রিন ও স্মুথ অনবোর্ডিং:** আধুনিক ইন্টারফেস এবং ইন্টারেক্টিভ মিটার ও ট্যারিফ সেটআপ।
            * **উন্নত ট্যারিফ কনফিগারেশন:** সার্ভিস চার্জ, ডিমান্ড চার্জ, মিটার ভাড়া ও ভ্যাট কাস্টমাইজেশন সুবিধা।
            * **স্বয়ংক্রিয় আপডেট:** সরাসরি অ্যাপের ভেতর থেকেই এক ক্লিকে ওটিএ (OTA) আপডেট নেওয়া যাবে।
            * **সিস্টেম রিকোয়ারমেন্ট:** Android 8.0 (API 26) বা তদূর্ধ্ব
            
            ---
            *স্বয়ংক্রিয়ভাবে GitHub Actions CI/CD দ্বারা বিল্ড এবং পাবলিশ করা হয়েছে।*
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
